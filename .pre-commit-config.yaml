repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: trace-validate
        name: traceability coverage
        entry: .venv/bin/python -m tools.trace.cli validate
        language: system
        pass_filenames: false
        always_run: true
