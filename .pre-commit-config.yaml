repos:
  - repo: local
    hooks:
      # ruff comes from the project's own environment, not from a pinned
      # pre-commit rev. Two ruff versions formatting the same file differently
      # is how a commit passes the hook and fails CI forever, each fixing what
      # the other undoes. One ruff, pinned by uv.lock, used by both gates.
      - id: lint
        name: ruff check + format
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true

      # The FAST gate. Everything here runs without a container runtime, so a
      # commit never requires Docker. The full gate -- integration tests and
      # traceability coverage -- runs in .github/workflows/ci.yml.
      #
      # REQ-INFRA-002's FR-009: no check may be absent from BOTH gates. If you
      # remove something here, it must already run in the workflow.
      - id: test-fast
        name: fast tests (no live services)
        entry: make test-fast
        language: system
        pass_filenames: false
        always_run: true
