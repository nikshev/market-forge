repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # The FAST gate. Everything here runs without a container runtime, so a
      # commit never requires Docker. The full gate -- integration tests and
      # traceability coverage -- runs in .github/workflows/ci.yml.
      #
      # REQ-INFRA-002's FR-009: no check may be absent from BOTH gates. If you
      # remove something here, it must already run in the workflow.
      - id: test-fast
        name: fast tests (no live services)
        entry: make test-fast
        language: system
        pass_filenames: false
        always_run: true
