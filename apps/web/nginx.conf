# @trace: REQ-WP-064
#
# Static files, and one proxy. `/api` reaches the API service by its compose
# name, so the browser makes same-origin requests and the application needs no
# built-in hostname.

# `Connection: upgrade` only when the client asked for an upgrade (REQ-WP-102).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # A single-page application: a deep link like /chart/binance/BTCUSDT is a
    # route the client resolves, not a file. Without this, PRD §27.1's links --
    # the ones every alert carries -- return 404 on a reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # `/api/` also carries the chart's live feed, a WebSocket at `/api/v1/live` (REQ-WP-102): the upgrade is
    # passed through, and an idle connection is not cut at nginx's default minute (the page sends nothing
    # while it listens). Still the one proxied location -- nothing else reaches the API.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
