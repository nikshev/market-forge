      CHANNELFLOW_INGEST_MAX_SILENCE_SECONDS: ${CHANNELFLOW_INGEST_MAX_SILENCE_SECONDS:-}
      # The volume profile's price bins (REQ-WP-089); empty means unset.
      CHANNELFLOW_PROFILE_BIN_WIDTHS: ${CHANNELFLOW_PROFILE_BIN_WIDTHS:-}
      CHANNELFLOW_PROFILE_BLOCK_SECONDS: ${CHANNELFLOW_PROFILE_BLOCK_SECONDS:-}
      CHANNELFLOW_LOG_LEVEL: ${CHANNELFLOW_LOG_LEVEL:-}
      CHANNELFLOW_ARCHIVE_URI: s3://${MINIO_BUCKET}/raw/cex
      CHANNELFLOW_INGEST_VENUE: okx
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # PRD §6.2's `worker`. §6.2 lists it alongside `api` and `ingest-binance` and
  # it exists as code now ([[REQ-WP-077]]): a periodic pass that reads the bars
  # table for each configured timeframe, calls `record_replay`, and writes the
  # channel snapshots, signals, confirmed extrema and extremum candidates that
  # [[REQ-PIPE-001]] deliberately excluded from the replay.
  #
  # The same image as the API with a different command: one Python image, and a
  # second would be a second dependency tree to keep in step ([[REQ-WP-066]]).
  #
  # One process per pass, deliberately. A pass over every series is not a
  # multiplexed daemon: it reads what the bars table holds and writes what is
  # missing, and the watermarks in `record_replay` make the interval a
  # freshness knob rather than a correctness one.
  worker:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The commit is baked in so a record can say which code produced it ([[REQ-INFRA-007]]).
        CHANNELFLOW_CODE_COMMIT: ${CHANNELFLOW_CODE_COMMIT:-}
        CHANNELFLOW_CODE_DIRTY: ${CHANNELFLOW_CODE_DIRTY:-}
    command:
      - python
      - -m
      - channelflow.pipeline.channel_main
      - --loop
      - ${CHANNELFLOW_CHANNEL_INTERVAL}
    environment:
      CHANNELFLOW_CATALOG_URI: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHANNELFLOW_WAREHOUSE: s3://${MINIO_BUCKET}/warehouse
      CHANNELFLOW_S3_ENDPOINT: http://minio:9000
      CHANNELFLOW_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      CHANNELFLOW_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CHANNELFLOW_S3_REGION: us-east-1
      CHANNELFLOW_TIMEFRAMES: ${CHANNELFLOW_TIMEFRAMES}
      CHANNELFLOW_CHANNEL_INTERVAL: ${CHANNELFLOW_CHANNEL_INTERVAL}
      # Registers each record it computes for the notary ([[REQ-INFRA-007]]). It holds no key and
      # touches no chain: signing is the `notary` service's alone.
      CHANNELFLOW_NOTARY_ENABLED: ${CHANNELFLOW_NOTARY_ENABLED:-false}
      CHANNELFLOW_NOTARY_FROM: ${CHANNELFLOW_NOTARY_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # The context collectors ([[REQ-WP-093]]): one per venue, polling that venue's public derivatives
  # endpoints (open interest, funding, mark and index) and storing each answer in `derivatives_state`.
  # They compute no feature -- the worker does -- and hold no key: every endpoint is public. A
  # collector that has stored nothing for three poll intervals reports unhealthy on its own
  # `/healthz`, which is what stops a dead source being read as a quiet one.
  context-binance: &context
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - channelflow.pipeline.context_main
    environment: &context-env
      CHANNELFLOW_CATALOG_URI: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHANNELFLOW_WAREHOUSE: s3://${MINIO_BUCKET}/warehouse
      CHANNELFLOW_S3_ENDPOINT: http://minio:9000
      CHANNELFLOW_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      CHANNELFLOW_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CHANNELFLOW_S3_REGION: us-east-1
      CHANNELFLOW_LOG_LEVEL: ${CHANNELFLOW_LOG_LEVEL:-}
      # What each collector holds beside its polls (REQ-WP-094, REQ-WP-095); empty turns them all off.
      CHANNELFLOW_CONTEXT_STREAMS: ${CHANNELFLOW_CONTEXT_STREAMS-liquidations,book}
      CHANNELFLOW_CONTEXT_VENUE: binance
      CHANNELFLOW_CONTEXT_PORT: "9101"
    ports:
      - "${CHANNELFLOW_BIND_ADDRESS:-127.0.0.1}:${CONTEXT_BINANCE_PORT:-9101}:9101"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9101/healthz').status==200 else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  context-bybit:
    <<: *context
    environment:
      <<: *context-env
      CHANNELFLOW_CONTEXT_VENUE: bybit
      CHANNELFLOW_CONTEXT_PORT: "9102"
    ports:
      - "${CHANNELFLOW_BIND_ADDRESS:-127.0.0.1}:${CONTEXT_BYBIT_PORT:-9102}:9102"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9102/healthz').status==200 else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  context-okx:
    <<: *context
    environment:
      <<: *context-env
      CHANNELFLOW_CONTEXT_VENUE: okx
      CHANNELFLOW_CONTEXT_PORT: "9103"
    ports:
      - "${CHANNELFLOW_BIND_ADDRESS:-127.0.0.1}:${CONTEXT_OKX_PORT:-9103}:9103"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9103/healthz').status==200 else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # The signal notary ([[REQ-INFRA-007]]): forms batches of registered records, commits one Merkle
  # root per batch through the SignalNotary contract, confirms it, and keeps an outbox that drains
  # when the chain returns. The ONLY service given the signing keystore, mounted read-only from
  # files outside the repository. Starts only when asked for (`docker compose up -d notary`):
  # a stack without keys must not run a service that crash-loops.
  notary:
    profiles: ["notary"]
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CHANNELFLOW_CODE_COMMIT: ${CHANNELFLOW_CODE_COMMIT:-}
        CHANNELFLOW_CODE_DIRTY: ${CHANNELFLOW_CODE_DIRTY:-}
    command:
      - python
      - -m
      - channelflow.notary.main
    environment:
      CHANNELFLOW_CATALOG_URI: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHANNELFLOW_WAREHOUSE: s3://${MINIO_BUCKET}/warehouse
      CHANNELFLOW_S3_ENDPOINT: http://minio:9000
      CHANNELFLOW_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      CHANNELFLOW_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CHANNELFLOW_S3_REGION: us-east-1
      MONAD_RPC_URL: ${MONAD_RPC_URL:-https://testnet-rpc.monad.xyz}
      MONAD_CHAIN_ID: ${MONAD_CHAIN_ID:-10143}
      MONAD_NOTARY_ADDRESS: ${MONAD_NOTARY_ADDRESS:-}
      MONAD_NOTARY_DEPLOY_BLOCK: ${MONAD_NOTARY_DEPLOY_BLOCK:-}
      # Paths inside the container; the files are the secrets below, never environment values.
      CHANNELFLOW_NOTARY_KEYSTORE: /run/secrets/notary_keystore
      CHANNELFLOW_NOTARY_PASSWORD_FILE: /run/secrets/notary_password
      CHANNELFLOW_NOTARY_INTERVAL: ${CHANNELFLOW_NOTARY_INTERVAL:-}
      CHANNELFLOW_NOTARY_BATCH_WINDOW: ${CHANNELFLOW_NOTARY_BATCH_WINDOW:-}
      CHANNELFLOW_NOTARY_MAX_BATCH: ${CHANNELFLOW_NOTARY_MAX_BATCH:-}
      CHANNELFLOW_NOTARY_MIN_BALANCE: ${CHANNELFLOW_NOTARY_MIN_BALANCE:-}
      CHANNELFLOW_NOTARY_MAX_GAS_PRICE: ${CHANNELFLOW_NOTARY_MAX_GAS_PRICE:-}
      CHANNELFLOW_NOTARY_GAS_MARGIN: ${CHANNELFLOW_NOTARY_GAS_MARGIN:-}
      CHANNELFLOW_NOTARY_SUBMIT_TIMEOUT: ${CHANNELFLOW_NOTARY_SUBMIT_TIMEOUT:-}
    secrets:
      - notary_keystore
      - notary_password
    ports:
      - "${CHANNELFLOW_BIND_ADDRESS:-127.0.0.1}:${NOTARY_METRICS_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # Higher timeframes from the one-minute series ([[REQ-WP-073]]). §5.1 names
  # four and §31 makes the list configuration; without this service the
  # deployment writes one series and a chart at any other timeframe renders an
  # empty series over data that is fine.
  #
  # A service of its own rather than a corner of `maintenance`: that one
  # *removes* -- prunes, compacts, expires -- and a producer of canonical rows
  # hidden inside it would be found by whoever reads this file last.
  #
  # Every pass is idempotent: it reads the open times already written and
  # produces only what is missing, so the loop interval is a freshness knob and
  # never a correctness one.
  resample:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - channelflow.pipeline.resample_main
      - --loop
      - ${CHANNELFLOW_RESAMPLE_INTERVAL}
    environment:
      CHANNELFLOW_CATALOG_URI: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHANNELFLOW_WAREHOUSE: s3://${MINIO_BUCKET}/warehouse
      CHANNELFLOW_S3_ENDPOINT: http://minio:9000
      CHANNELFLOW_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      CHANNELFLOW_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CHANNELFLOW_S3_REGION: us-east-1
      CHANNELFLOW_TIMEFRAMES: ${CHANNELFLOW_TIMEFRAMES}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # The plane degrades in two directions without this ([[REQ-WP-070]]): reads get
  # slower as files accumulate, and storage grows because nothing collects what
  # a compaction unreferenced. Measured before it existed: 2.6 MB of bar data
  # against 304.9 MB of metadata.
  #
  # Expiry is opt-in even here. `CHANNELFLOW_KEEP_DAYS` empty means compact and
  # keep everything, because expiring is the one operation that destroys.
  maintenance:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - >
        python -m channelflow.pipeline.maintenance_main
        --loop "$$CHANNELFLOW_MAINTENANCE_INTERVAL"
        $${CHANNELFLOW_KEEP_DAYS:+--keep-days "$$CHANNELFLOW_KEEP_DAYS"}
    environment:
      CHANNELFLOW_CATALOG_URI: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHANNELFLOW_WAREHOUSE: s3://${MINIO_BUCKET}/warehouse
      CHANNELFLOW_S3_ENDPOINT: http://minio:9000
      CHANNELFLOW_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      CHANNELFLOW_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CHANNELFLOW_S3_REGION: us-east-1
      CHANNELFLOW_MAINTENANCE_INTERVAL: ${CHANNELFLOW_MAINTENANCE_INTERVAL}
      CHANNELFLOW_KEEP_DAYS: ${CHANNELFLOW_KEEP_DAYS}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    logging: *default-logging
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "${CHANNELFLOW_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT}:8080"
    depends_on:
      api:
        condition: service_healthy

  # An HTTPS address for the Telegram Mini App ([[REQ-WP-080]]). Off unless the `telegram` profile is
  # named: `docker compose --profile telegram up -d --build`. An outbound tunnel to Cloudflare, which
  # serves the public hostname and terminates TLS, so no host port is opened and no certificate lives
  # here. Its public hostname must point at `http://web:8080` (set in Cloudflare's dashboard).
  cloudflared:
    logging: *default-logging
    profiles: ["telegram"]
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate run
    environment:
      # Empty by default and not `:?`: that is evaluated for every service, profile or not, and would
      # break `docker compose config` for everyone who never turns the profile on. Empty makes the
      # tunnel fail visibly at start.
      TUNNEL_TOKEN: ${CHANNELFLOW_TUNNEL_TOKEN:-}
      # UDP egress to Cloudflare's edge is blocked on this host, and the default (QUIC) never
      # connects; `lexa-reader` found the same.
      TUNNEL_TRANSPORT_PROTOCOL: ${CHANNELFLOW_TUNNEL_PROTOCOL:-http2}
    depends_on:
      - web
    restart: unless-stopped

  prometheus:
    logging: *default-logging
    image: prom/prometheus:v3.6.0
    ports:
      - "${CHANNELFLOW_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT}:9090"
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - ${CHANNELFLOW_DATA_DIR:-./data}/prometheus:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Renders the dashboard generated from `channelflow.observability`. The file
  # is generated, never edited -- a hand-written copy would go stale the day a
  # metric gains a producer.
  grafana:
    logging: *default-logging
    image: grafana/grafana:12.2.0
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${CHANNELFLOW_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT}:3000"
    environment:
      # Anonymous access is opt-in, and off by default ([[REQ-WP-072]]). The old
      # setting was an anonymous *admin* with the login form disabled, under a
      # comment whose premise was "not reachable from anywhere" -- true of a
      # laptop, false the moment this is deployed, and the setting could not tell
      # the difference.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      # `:?` rather than a bare substitution: blank is not a password, and
      # Grafana falls back to `admin` when it gets one. Compose refuses to
      # start and says which variable is missing -- the same fail-closed rule
      # the bind address needed.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set it in .env; see .env.example}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${CHANNELFLOW_DATA_DIR:-./data}/grafana:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

# No named volumes. Every stateful service writes into `CHANNELFLOW_DATA_DIR`
# ([[REQ-WP-065]]), so the data is a directory the operator chose: on a server a
# mounted disk, in a checkout `./data`, and copyable with ordinary tools either
# way.
#
# A named volume is initialised by Docker, which copies the image's ownership
# onto it; a bind mount keeps whatever the host directory has. `make data-dirs`
# creates each one and gives it to the user its service runs as, and checks it
# **as that user** -- a check run as the operator would pass everywhere and
# prove nothing.

# The signal notary's signing material ([[REQ-INFRA-007]]). Named by variable, never by a literal
# path, and defaulting to /dev/null so `docker compose config` works on a stack that has no keys.
# Only the `notary` service mounts them; the files live outside the repository and are readable
# by the unprivileged user the container runs as (uid 10001, mode 400).
secrets:
  notary_keystore:
    file: ${MONAD_KEYSTORE_FILE:-/dev/null}
  notary_password:
    file: ${MONAD_SIGNER_PASSWORD_FILE:-/dev/null}
