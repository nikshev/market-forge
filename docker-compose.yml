# Local development stack for ChannelFlow (REQ-WP-001).
#
# PostgreSQL for transactional metadata and control plane; MinIO as the
# S3-compatible object store that ADR-002 makes the canonical data plane.
# There is deliberately NO analytical database service -- ADR-002 drops
# ClickHouse and adopts the PRD's target storage profile from the start.
#
# Image tags are pinned to explicit releases, never `latest`: Principle XI
# requires a checkout to resolve to the same stack later. See
# specs/002-project-bootstrap/research.md for why tags rather than digests.
#
# MinIO comes from quay.io, not Docker Hub. Docker Hub stopped serving
# `minio/minio` entirely -- the repository is gone, not the tag -- and ADR-064
# records why that is a registry problem rather than a pinning one.
#
# Ports and credentials come from .env (copy .env.example). Nothing here is
# hardcoded, so a port clash is fixed by editing one file, and neither is the
# data directory: `CHANNELFLOW_DATA_DIR` moves the whole stack's state to a
# mounted disk without touching this file.
#
# Every published port binds `CHANNELFLOW_BIND_ADDRESS`, and the default is in
# the substitution itself -- `${CHANNELFLOW_BIND_ADDRESS:-127.0.0.1}`, not in
# .env.example alone ([[REQ-WP-072]]). Measured the hard way: with the bare
# `${CHANNELFLOW_BIND_ADDRESS}` form, an .env written before the variable existed
# leaves it blank, compose parses `":19092:9092"` as a published port with no
# host_ip, and every service binds **all interfaces** -- the exact opposite of
# the intent, silently. A security default has to fail closed. A bare `"${PORT}:…"` binds every interface, which
# on a host that is not a laptop offers Postgres, MinIO and the event backbone to
# whatever can reach it. Binding to loopback also removes a question rather than
# answering it: on Linux, Docker's rules live in the `nat` table's DOCKER chain,
# traversed before the INPUT chain `ufw` manages, so a published port can be
# reachable while the firewall reports it denied.

# Every service's log is capped, by one block applied through an alias (REQ-WP-078).
#
# Bybit's container log reached 6.6 GB in six days and nothing capped it or any other
# service. A cap does not make a noisy service quiet -- the per-trade lines were demoted
# at their source for that -- it stops the next noisy one filling a disk shared with other
# things. 20 MB x 3 files is 60 MB a service: days of history at the expected rate, and a
# rotation every 35 minutes at the rate the noisiest service had. Both numbers are
# configuration, and `tests/unit/deploy/test_compose_logging.py` fails for any service
# added without the alias.
#
# A cap applies to a container when it is *created*; editing this file changes nothing
# for one already running until `docker compose up -d` recreates it.
# The object store, and the one-shot that creates its bucket, run the SAME image (REQ-INFRA-013): it
# contains `mc`, so there is no separate client image to vanish. A community-maintained fork of
# MinIO ("SILO", pgsty/minio), because MinIO's own images are no longer served to anonymous clients
# (ADR-064 found the first removal, ADR-069 the second). Pinned to a release tag AND the index digest:
# a third party's tag can be re-pushed. `ci.yml` names the same string and a test fails if they differ.
# Release 2026-08-04 is the one the object-store integration tests were run against.
x-minio-image: &minio-image docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${CHANNELFLOW_LOG_MAX_SIZE:-20m}
    max-file: "${CHANNELFLOW_LOG_MAX_FILE:-3}"

name: channelflow

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${CHANNELFLOW_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT}:5432"
    volumes:
      - ${CHANNELFLOW_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      # pg_isready, not a TCP probe: Postgres accepts connections before it
      # will serve queries, and reporting success into that gap is the race
      # SC-002 exists to close.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  minio:
    logging: *default-logging
    image: *minio-image
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${CHANNELFLOW_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT}:9000"
      - "${CHANNELFLOW_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - ${CHANNELFLOW_DATA_DIR:-./data}/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  # One-shot: creates the development bucket, then exits. `make up` waits for
  # it to complete, so a healthy stack always has the bucket the tests expect.
  minio_init:
    logging: *default-logging
    image: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      echo 'bucket ready: '$${MINIO_BUCKET}
      "

  # The Kafka-protocol event backbone (ADR-063). Redpanda rather than Apache
  # Kafka because it is a single binary with no JVM and no ZooKeeper, which
  # matters for a stack a developer runs on a laptop -- and because the choice
  # is reversible: it speaks the Kafka protocol, so swapping it for Kafka
  # changes this file and a bootstrap address, not a line of application code.
  #
  # Community Edition is BSL, converting to Apache 2.0 four years after each
  # merge. Self-hosted production is permitted; reselling it as a service is
  # not, which is not something this project does.
  redpanda:
    logging: *default-logging
    image: redpandadata/redpanda:v25.2.5
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://127.0.0.1:${REDPANDA_PORT}
    ports:
      - "${CHANNELFLOW_BIND_ADDRESS:-127.0.0.1}:${REDPANDA_PORT}:9092"
    volumes:
      - ${CHANNELFLOW_DATA_DIR:-./data}/redpanda:/var/lib/redpanda/data
    healthcheck:
      # `cluster health` rather than a TCP probe, for the reason Postgres uses
      # pg_isready: the port opens before the cluster will serve, and reporting
      # success into that gap is a race a test would lose.
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Scrapes the API's exposition (REQ-WP-055). Development-only: it reaches the
  # API on the host rather than in the network, because the API runs from the
  # host in development and containerising it is a separate decision.
  # PRD §6.2's `api` and `web`. Built here rather than pulled: they are this
  # repository's own code, and an image tag would name a build nobody in this
  # checkout can reproduce ([[REQ-WP-064]]).
  #
  # §6.2 also names `worker`. It does not exist as code -- REQ-PIPE-001 chose a
  # replay over a daemon deliberately -- so it has no service here. A container
  # running nothing is worse than an absent one: it reports healthy.
  # `ingest-binance` does exist, below ([[REQ-WP-066]]).
  api:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CHANNELFLOW_CATALOG_URI: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHANNELFLOW_WAREHOUSE: s3://${MINIO_BUCKET}/warehouse
      # The object store is reached by service name inside the network, not by
      # the host port .env publishes for a developer's browser.
      CHANNELFLOW_S3_ENDPOINT: http://minio:9000
      CHANNELFLOW_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      CHANNELFLOW_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CHANNELFLOW_S3_REGION: us-east-1
      # The set this deployment produces ([[REQ-WP-074]]). `/api/v1/timeframes`
      # reports it, and the resampler builds it -- one `.env` value for both, so
      # what a chart offers cannot disagree with what exists.
      CHANNELFLOW_TIMEFRAMES: ${CHANNELFLOW_TIMEFRAMES}
      # Telegram Mini App authentication ([[REQ-WP-080]]). `off` unless asked for. The bot token is
      # the one the alert sender uses, and this is the only service given it.
      CHANNELFLOW_TELEGRAM_AUTH: ${CHANNELFLOW_TELEGRAM_AUTH:-off}
      CHANNELFLOW_TELEGRAM_MAX_AGE_SECONDS: ${CHANNELFLOW_TELEGRAM_MAX_AGE_SECONDS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "${CHANNELFLOW_BIND_ADDRESS:-127.0.0.1}:${API_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # `/readyz`, not a TCP probe: a process that started and cannot read its
      # warehouse serves empty results, and an empty result is this system's
      # most dangerous shape. The probe asks the catalog a question.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz').status==200 else 1)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # PRD §6.2's `ingest-binance`. The same image as the API with a different
  # command: one Python image, and a second would be a second dependency tree
  # to keep in step ([[REQ-WP-066]]).
  #
  # One process per symbol, deliberately. `BarBuilder` is one symbol and one
  # timeframe, and a daemon multiplexing several would share one socket's
  # failure across all of them.
  ingest-binance:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - channelflow.pipeline.ingest_main
    environment:
      CHANNELFLOW_CATALOG_URI: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHANNELFLOW_WAREHOUSE: s3://${MINIO_BUCKET}/warehouse
      CHANNELFLOW_S3_ENDPOINT: http://minio:9000
      CHANNELFLOW_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      CHANNELFLOW_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CHANNELFLOW_S3_REGION: us-east-1
      CHANNELFLOW_INGEST_SYMBOLS: ${CHANNELFLOW_INGEST_SYMBOLS}
      CHANNELFLOW_INGEST_TIMEFRAME_NS: ${CHANNELFLOW_INGEST_TIMEFRAME_NS}
      # Empty means unset. Compose forwards only the variables a service names, so a
      # setting that is not listed here is unreachable on the host.
      CHANNELFLOW_INGEST_MAX_SILENCE_SECONDS: ${CHANNELFLOW_INGEST_MAX_SILENCE_SECONDS:-}
      # The volume profile's price bins (REQ-WP-089); empty means unset.
      CHANNELFLOW_PROFILE_BIN_WIDTHS: ${CHANNELFLOW_PROFILE_BIN_WIDTHS:-}
      CHANNELFLOW_PROFILE_BLOCK_SECONDS: ${CHANNELFLOW_PROFILE_BLOCK_SECONDS:-}
      CHANNELFLOW_LOG_LEVEL: ${CHANNELFLOW_LOG_LEVEL:-}
      # The raw tier of §6.4.4, in the same bucket as the warehouse and beside
      # it rather than inside it: `raw/` and `warehouse/` are different zones.
      CHANNELFLOW_ARCHIVE_URI: s3://${MINIO_BUCKET}/raw/cex
      CHANNELFLOW_INGEST_VENUE: binance
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # §5.1's Phase 1 universe is three symbols -- BTCUSDT, ETHUSDT, SOLUSDT -- and
  # until 2026-09-17 this stack ingested one. These are the other two.
  #
  # Three services rather than one variable holding three names, because
  # `ingest_main` refuses a configuration naming more than one symbol: a daemon
  # multiplexing several would share one socket's failure across all of them,
  # and one stalled symbol would stop the others silently.
  #
  # The first keeps the bare name `ingest-binance` because §6.2 spells it that
  # way and `docs/deployment.md` names it in commands a reader pastes. The
  # asymmetry is the PRD's spelling preserved, not an oversight.
  ingest-binance-eth:
