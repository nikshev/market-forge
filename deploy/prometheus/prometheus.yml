# Scrapes the ChannelFlow read API's exposition (REQ-WP-056).
#
# The path is `/metrics` and not `/api/v1/metrics`: the exposition is
# operational rather than part of PRD section 28's read API, and a test asserts
# this file's path against the route's so the two cannot drift.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: channelflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: api

  # The signal notary's outbox and balance (REQ-INFRA-007). Present only when the `notary` service
  # runs; a down target is then the alarm, and an absent service is merely an unreachable target.
  - job_name: channelflow-notary
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          service: notary

  # The context collectors (REQ-WP-093): the age of each venue's last successful poll and its failure
  # counts. A collector that stops storing turns its panes back to "no data"; this is how that is seen.
  - job_name: channelflow-context
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9101"]
        labels: {service: context, venue: binance}
      - targets: ["host.docker.internal:9102"]
        labels: {service: context, venue: bybit}
      - targets: ["host.docker.internal:9103"]
        labels: {service: context, venue: okx}
      - targets: ["host.docker.internal:9104"]
        labels: {service: context, venue: hyperevm}
