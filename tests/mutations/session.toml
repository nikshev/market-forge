# Reproduces the mutation sweep recorded for the shared connector session.
#
# Patterns are TOML *literal* strings on purpose: the basic form treats a
# trailing backslash as a line continuation and eats the next line's indentation.
source = "src/channelflow/connectors/session.py"
tests = ["tests/unit/connectors", "tests/unit/pipeline/test_session_reconnect.py", "tests/unit/pipeline/test_silence_detector.py"]

[[mutation]]
name = "bybit and okx payloads swapped"
find = '''    ping_payload='{"op":"ping"}','''
replace = '''    ping_payload="ping",'''

[[mutation]]
name = "okx idle timeout is bybit's"
find = '''    idle_timeout_ns=30 * SECOND_NS,
    client_ping_interval_ns=15 * SECOND_NS,'''
replace = '''    idle_timeout_ns=60 * SECOND_NS,
    client_ping_interval_ns=15 * SECOND_NS,'''

[[mutation]]
name = "bybit announces its closes"
find = '''    ping_payload='{"op":"ping"}',
    announces_close=False,'''
replace = '''    ping_payload='{"op":"ping"}',
    announces_close=True,'''

[[mutation]]
name = "silent drops not inferred"
find = '''        if limit is not None and silent_for > limit:'''
replace = '''        if False:'''


[[mutation]]
name = "silence is inferred only where a venue does not announce its closes (the old gate)"
find = '''    if policy.max_silence_ns is not None:
        return policy.max_silence_ns
    if not policy.announces_close:'''
replace = '''    if policy.max_silence_ns is not None and not policy.announces_close:
        return policy.max_silence_ns
    if not policy.announces_close:'''


[[mutation]]
name = "silent drops not counted"
find = '''        if kind == "silence":
            self.metrics.silent_drops += 1'''
replace = '''        if kind == "silence":
            pass'''


[[mutation]]
name = "connect throttle ignored"
find = '''        if now < self._next_attempt_ns:'''
replace = '''        if False and now < self._next_attempt_ns:'''


[[mutation]]
name = "throttled reconnects not counted"
find = '''            self.metrics.throttled_reconnects += 1
            return False'''
replace = '''            return False'''

[[mutation]]
name = "every venue is pinged by the client"
find = '''            self.policy.keepalive is Keepalive.CLIENT_INITIATED'''
replace = '''            True'''

[[mutation]]
name = "ping schedule off by an interval"
find = '''            and now - self._last_ping_ns >= interval'''
replace = '''            and now - self._last_ping_ns >= interval * 2'''

[[mutation]]
name = "ping clock never advances"
find = '''            self._last_ping_ns = now'''
replace = '''            pass'''

[[mutation]]
name = "inbound data does not reset the idle clock"
find = '''        self._last_inbound_ns = now
        if self._down_since_ns is not None:'''
replace = '''        if self._down_since_ns is not None:'''


[[mutation]]
name = "a server ping is not answered"
find = '''        self.connector.pong()
        self.on_frame()'''
replace = '''        self.on_frame()'''

[[mutation]]
name = "a reconnect does not need a snapshot"
find = '''        self._needs_snapshot = True
        # The venue's connect limit: no second attempt inside it, whatever the reason.'''
replace = '''        self._needs_snapshot = False
        # The venue's connect limit: no second attempt inside it, whatever the reason.'''


[[mutation]]
name = "connection failures not counted"
find = '''            self.metrics.connection_failures += 1'''
replace = '''            pass'''

[[mutation]]
name = "lifetime reconnect never fires"
find = '''        if lifetime is not None and now - self._connected_at_ns >= lifetime:'''
replace = '''        if False and lifetime is not None and now - self._connected_at_ns >= lifetime:'''

[[mutation]]
name = "a slow ping policy is accepted"
find = '''            if self.idle_timeout_ns is not None and (
                self.client_ping_interval_ns >= self.idle_timeout_ns
            ):'''
replace = '''            if False:'''

[[mutation]]
name = "a payloadless ping policy is accepted"
find = '''            if self.ping_payload is None or self.client_ping_interval_ns is None:'''
replace = '''            if False:'''

[[mutation]]
name = "hypercore payload is bybit's"
find = '''    ping_payload='{"method":"ping"}','''
replace = '''    ping_payload='{"op":"ping"}','''

[[mutation]]
name = "hypercore announces its closes"
find = '''    ping_payload='{"method":"ping"}',
    announces_close=False,'''
replace = '''    ping_payload='{"method":"ping"}',
    announces_close=True,'''

# --- REQ-WP-078: each decision of the new reconnect, removed in turn -------------------
#
# The belief that sat in the old `tick` -- a venue that announces its closes needs no
# second-guessing -- let a Binance feed sit dead for four days. These are the mutations
# that put it, or any piece of its replacement, back.

[[mutation]]
name = "a dead reader is not noticed"
find = '''        if not self.connector.alive:'''
replace = '''        if False:'''

[[mutation]]
name = "the stream lifetime no longer reconnects"
find = '''        if lifetime is not None and now - self._connected_at_ns >= lifetime:'''
replace = '''        if False and lifetime is not None and now - self._connected_at_ns >= lifetime:'''

[[mutation]]
name = "the backoff never grows"
find = '''            self.policy.min_connect_interval_ns * 2 ** (attempts - 1),'''
replace = '''            self.policy.min_connect_interval_ns,'''

[[mutation]]
name = "the backoff has no ceiling"
find = '''            self.policy.max_connect_backoff_ns,
        )
        self._next_attempt_ns = now + delay'''
replace = '''            2**62,
        )
        self._next_attempt_ns = now + delay'''

[[mutation]]
name = "a refused connect escapes tick"
find = '''        except Exception as error:
            outcome = f"connect() failed: {error}"'''
replace = '''        except KeyboardInterrupt as error:
            outcome = f"connect() failed: {error}"'''

[[mutation]]
name = "connect() returning counts as recovery"
find = '''        self._needs_snapshot = True
        # The venue's connect limit: no second attempt inside it, whatever the reason.'''
replace = '''        self._needs_snapshot = True
        self._attempts = 0
        # The venue's connect limit: no second attempt inside it, whatever the reason.'''

[[mutation]]
name = "a recovery is never logged"
find = '''        if self._down_since_ns is not None:
            logger.info('''
replace = '''        if False:
            logger.info('''

[[mutation]]
name = "the first sign of an outage is not logged"
find = '''            logger.warning("%s connection down: %s", self.policy.venue, why)'''
replace = '''            pass'''

[[mutation]]
name = "every failed attempt is logged"
find = '''        elif attempts >= 2 and attempts & (attempts - 1) == 0:'''
replace = '''        elif attempts >= 2:'''

[[mutation]]
name = "a reader that ended is not counted"
find = '''        elif kind == "reader":
            self.metrics.dead_readers += 1'''
replace = '''        elif kind == "reader":
            pass'''

[[mutation]]
name = "an explicit silence limit is ignored"
find = '''    if policy.max_silence_ns is not None:
        return policy.max_silence_ns'''
replace = '''    if False:
        return policy.max_silence_ns'''

# Found by the first live reconnect proof: a ping to a socket that had just gone raised out
# of `tick` and ended the daemon.
[[mutation]]
name = "a ping that cannot be sent ends the loop"
find = '''            except Exception as error:  # noqa: BLE001 -- any failure to write is the same fact'''
replace = '''            except KeyboardInterrupt as error:'''

[[mutation]]
name = "a failed ping is retried on every tick"
find = '''            self._last_ping_ns = now
            try:
                self.connector.send(self.policy.ping_payload or "")'''
replace = '''            try:
                self.connector.send(self.policy.ping_payload or "")'''
