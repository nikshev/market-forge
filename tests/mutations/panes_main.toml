# REQ-WP-097: the report's exit codes and what it queries.
#
# Patterns are TOML *literal* strings on purpose: the basic form treats a
# trailing backslash as a line continuation and eats the next line's indentation.
source = "tools/panes/__main__.py"
tests = ["tests/tools/panes/test_classify.py"]

[[mutation]]
name = "a pane with no producer does not fail the report"
find = '''                failed = failed or state.state == NO_PRODUCER'''
replace = '''                failed = failed'''

[[mutation]]
name = "an unreachable API is not exit 2"
find = '''        print(f"the API could not be read: {exc}", file=sys.stderr)
        return 2'''
replace = '''        print(f"the API could not be read: {exc}", file=sys.stderr)
        return 1'''

[[mutation]]
name = "a failure exits zero"
find = '''    return 1 if failed else 0'''
replace = '''    return 0'''

[[mutation]]
name = "a markets read that fails is an empty report"
find = '''    if status != 200 or not listed:
        raise ApiUnreachable(f"/api/v1/markets answered HTTP {status}")'''
replace = '''    if False:
        raise ApiUnreachable(f"/api/v1/markets answered HTTP {status}")'''

[[mutation]]
name = "the range starts at now"
find = '''                start_ns=now_ns - hours * HOUR_NS,'''
replace = '''                start_ns=now_ns,'''

[[mutation]]
name = "the hours are ignored"
find = '''                start_ns=now_ns - hours * HOUR_NS,'''
replace = '''                start_ns=now_ns - 24 * HOUR_NS,'''

[[mutation]]
name = "the timeframe filter is ignored"
find = '''        t for t in offered["timeframes"] if only_timeframes is None or t["token"] in only_timeframes'''
replace = '''        t for t in offered["timeframes"]'''

[[mutation]]
name = "the consensus read is not made"
find = '''    status, consensus = get(
        "/api/v1/consensus",'''
replace = '''    status, consensus = 404, None
    get(
        "/api/v1/consensus",'''
