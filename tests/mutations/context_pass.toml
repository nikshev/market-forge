# REQ-WP-093: the worker's context-feature pass. Each mutation is a way of letting a feature be
# built from something not knowable at the bar's close, of feeding funding a polled estimate, of
# showing a stale figure as current, or of writing a bar twice -- and a test must fail.
#
# Patterns are TOML *literal* strings on purpose: the basic form treats a
# trailing backslash as a line continuation and eats the next line's indentation.
source = "src/channelflow/pipeline/context_pass.py"
tests = ["tests/unit/pipeline/test_context_pass.py", "tests/unit/pipeline/test_context_pass_liquidations.py", "tests/unit/pipeline/test_context_pass_book.py", "tests/unit/pipeline/test_context_pass_dex.py"]

[[mutation]]
name = "a bar that is not final gets a row"
find = '''        if bar.is_final:
            grouped[(bar.venue, bar.symbol, bar.timeframe_ns)].append(bar)'''
replace = '''        if True:
            grouped[(bar.venue, bar.symbol, bar.timeframe_ns)].append(bar)'''

[[mutation]]
name = "the watermark is ignored and a bar is written again"
find = '''        if close_ns > latest.get((venue, symbol, timeframe_ns, name), -1)'''
replace = '''        if True'''

[[mutation]]
name = "the watermark is per series, not per feature"
find = '''        if close_ns > latest.get((venue, symbol, timeframe_ns, name), -1)'''
replace = '''        if close_ns > max((v for k, v in latest.items() if k[:3] == (venue, symbol, timeframe_ns)), default=-1)'''
survives = '''Equivalent for the tests, which write every feature of a series for every bar. A per-series watermark differs from a per-feature one only when one feature has a row for a later bar than another, which needs a gap in one feature's data in the middle of the range; no fixture has one and the pass's behaviour there (a bar looked at again) is the documented cost of the per-feature design, not a property a test can distinguish without constructing exactly that gap. Left as the one deliberate survivor.'''

[[mutation]]
name = "a series with no perpetual is given states anyway"
find = '''        perpetual = sources.perpetual_for(venue, symbol)
        if perpetual is None:
            continue'''
replace = '''        perpetual = sources.perpetual_for(venue, symbol) or symbol
        if False:
            continue'''

[[mutation]]
name = "one failing derivatives series stops the pass"
find = '''            except Exception as cause:  # noqa: BLE001 -- one series must not end the pass
                _report(venue, symbol, tf_minutes, "context", cause)'''
replace = '''            except ZeroDivisionError as cause:
                _report(venue, symbol, tf_minutes, "context", cause)'''

[[mutation]]
name = "one failing liquidation series stops the pass"
find = '''            except Exception as cause:  # noqa: BLE001 -- one series must not end the pass
                _report(venue, symbol, tf_minutes, "liquidation", cause)'''
replace = '''            except ZeroDivisionError as cause:
                _report(venue, symbol, tf_minutes, "liquidation", cause)'''

[[mutation]]
name = "a failed commit stops the pass"
find = '''        except Exception as cause:  # noqa: BLE001 -- the channel step must still run
            print(
                f"  context: could not write {len(pending)} row(s) -- "'''
replace = '''        except ZeroDivisionError as cause:
            print(
                f"  context: could not write {len(pending)} row(s) -- "'''

[[mutation]]
name = "the liquidation rows are committed on their own"
find = '''                    pending.extend(_fresh_rows(latest, venue, symbol, timeframe_ns, close, values))'''
replace = '''                    if r := _fresh_rows(latest, venue, symbol, timeframe_ns, close, values):
                        table.append(r)'''

[[mutation]]
name = "the liquidation window is read from the whole event list"
find = '''                    lo, hi = bisect_right(times, close - WINDOW_NS), bisect_right(times, close)'''
replace = '''                    lo, hi = 0, len(times)'''
survives = '''Equivalent, by design: `liquidation_values` filters events by event time and receipt time and the library's `window` keeps only `(close - window, close]`, so handing it every event gives the same answer. The slice is there for cost -- a bar should not scan every event ever stored -- and a test of cost is not a behaviour test.'''

[[mutation]]
name = "one failing book series stops the pass"
find = '''            except Exception as cause:  # noqa: BLE001 -- one series must not end the pass
                _report(venue, symbol, tf_minutes, "book", cause)'''
replace = '''            except ZeroDivisionError as cause:
                _report(venue, symbol, tf_minutes, "book", cause)'''

[[mutation]]
name = "a series is given the book of its perpetual instead of its own market"
find = '''        series_minutes = minutes.get((venue, symbol))'''
replace = '''        series_minutes = minutes.get((venue, sources.perpetual_for(venue, symbol) or symbol))'''
survives = '''Equivalent while a series and its perpetual have the same symbol, which they do for every series the deployment shows (the Binance spot BTCUSDT and its USDT-M perpetual BTCUSDT are both "BTCUSDT"); the distinction is by market type, not by symbol, and is kept by `MARKET_TYPE` in the stream module and asserted there. The pass test with a differently named second stream proves the lookup uses the series' own name.'''

