# The depth table's own decisions.
source = "src/channelflow/tables/dex_depth.py"
tests = "tests/unit/tables/test_dex_tables.py"

[[mutation]]
name = "reachable not recorded"
find = '''                    "reachable": quote.reachable,'''
replace = '''                    "reachable": True,'''

[[mutation]]
name = "reached bps is the target"
find = '''                    "reached_bps": quote.reached_bps,'''
replace = '''                    "reached_bps": quote.target_bps,'''

[[mutation]]
name = "only one side is written"
find = '''    for side, quotes in ((UP, curve.up), (DOWN, curve.down)):'''
replace = '''    for side, quotes in ((UP, curve.up),):'''

[[mutation]]
name = "sides are swapped"
find = '''    for side, quotes in ((UP, curve.up), (DOWN, curve.down)):'''
replace = '''    for side, quotes in ((DOWN, curve.up), (UP, curve.down)):'''

[[mutation]]
name = "amounts converted at write time"
find = '''                    "amount0": quote.amount0,'''
replace = '''                    "amount0": quote.amount0 * curve.price,'''
