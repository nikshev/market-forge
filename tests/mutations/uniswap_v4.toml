# Reproduces the mutation sweep recorded for this module.
#
# Patterns are TOML *literal* strings on purpose: the basic form treats a
# trailing backslash as a line continuation and eats the next line's indentation.
source = "src/channelflow/dex/uniswap_v4.py"
tests = "tests/unit/dex/test_uniswap_v4.py"

[[mutation]]
name = "id packs instead of encoding"
find = '''        _word(int(key.currency0, 16) & _ADDRESS_MASK)'''
replace = '''        int(key.currency0, 16).to_bytes(20, "big")'''

[[mutation]]
name = "tick spacing truncated"
find = '''        + _word(key.tick_spacing)'''
replace = '''        + _word(key.tick_spacing & 0xFFFFFF)'''

[[mutation]]
name = "fee omitted from the id"
find = '''        + _word(key.fee)
'''
replace = ''''''

[[mutation]]
name = "hooks omitted from the id"
find = '''        + _word(int(key.hooks, 16) & _ADDRESS_MASK)
'''
replace = ''''''

[[mutation]]
name = "currencies swapped in the id"
find = '''        _word(int(key.currency0, 16) & _ADDRESS_MASK)
        + _word(int(key.currency1, 16) & _ADDRESS_MASK)'''
replace = '''        _word(int(key.currency1, 16) & _ADDRESS_MASK)
        + _word(int(key.currency0, 16) & _ADDRESS_MASK)'''

[[mutation]]
name = "dynamic fee is a bit test"
find = '''        return self.fee == DYNAMIC_FEE_FLAG'''
replace = '''        return bool(self.fee & DYNAMIC_FEE_FLAG)'''

[[mutation]]
name = "hook mask too wide"
find = '''ALL_HOOK_MASK = (1 << 14) - 1'''
replace = '''ALL_HOOK_MASK = (1 << 16) - 1'''

[[mutation]]
name = "hook mask too narrow"
find = '''ALL_HOOK_MASK = (1 << 14) - 1'''
replace = '''ALL_HOOK_MASK = (1 << 8) - 1'''

[[mutation]]
name = "returns-delta mask narrowed"
find = '''RETURNS_DELTA_MASK = (
    HookFlag.BEFORE_SWAP_RETURNS_DELTA
    | HookFlag.AFTER_SWAP_RETURNS_DELTA
    | HookFlag.AFTER_ADD_LIQUIDITY_RETURNS_DELTA
    | HookFlag.AFTER_REMOVE_LIQUIDITY_RETURNS_DELTA
)'''
replace = '''RETURNS_DELTA_MASK = HookFlag.BEFORE_SWAP_RETURNS_DELTA'''

[[mutation]]
name = "fee-touching mask narrowed"
find = '''FEE_TOUCHING_MASK = HookFlag.BEFORE_SWAP | HookFlag.AFTER_SWAP'''
replace = '''FEE_TOUCHING_MASK = HookFlag.AFTER_SWAP'''

[[mutation]]
name = "custom accounting last"
find = '''    if permissions & RETURNS_DELTA_MASK:
        return ReconstructionClass.CUSTOM_ACCOUNTING
'''
replace = ''''''

[[mutation]]
name = "dynamic fee before delta"
find = '''    if permissions & RETURNS_DELTA_MASK:
        return ReconstructionClass.CUSTOM_ACCOUNTING
    if key.is_dynamic_fee or permissions & FEE_TOUCHING_MASK:'''
replace = '''    if key.is_dynamic_fee or permissions & FEE_TOUCHING_MASK:
        return ReconstructionClass.DYNAMIC_FEE_CL
    if permissions & RETURNS_DELTA_MASK:'''

[[mutation]]
name = "validity not consulted"
find = '''    if not is_valid(key):
        return ReconstructionClass.UNKNOWN
'''
replace = ''''''

[[mutation]]
name = "hooked falls to standard"
find = '''    if permissions:
        return ReconstructionClass.HOOK_AUGMENTED_CL
'''
replace = ''''''

[[mutation]]
name = "fee cap unchecked"
find = '''    if key.fee != DYNAMIC_FEE_FLAG and key.fee > MAX_LP_FEE:
        return False
'''
replace = ''''''

[[mutation]]
name = "pairing rule dropped"
find = '''        if permissions & returns_delta and not permissions & action:'''
replace = '''        if False and permissions & returns_delta and not permissions & action:'''

[[mutation]]
name = "no-hook dynamic allowed"
find = '''        return not key.is_dynamic_fee'''
replace = '''        return True'''

[[mutation]]
name = "flagless hook allowed"
find = '''    return bool(permissions) or key.is_dynamic_fee'''
replace = '''    return True'''

[[mutation]]
name = "key fee never refuses"
find = '''    if key.is_dynamic_fee or key.permissions & FEE_TOUCHING_MASK:
        raise NotPointInTime(f"fee for {pool_id(key)} must come from the swap, not the key")
'''
replace = ''''''

[[mutation]]
name = "uint24 bound unchecked"
find = '''        if not 0 <= self.fee <= _UINT24:
            raise ValueError(f"fee does not fit in uint24: {self.fee}")
'''
replace = ''''''

[[mutation]]
name = "int24 bound unchecked"
find = '''        if not -_INT24_MAX - 1 <= self.tick_spacing <= _INT24_MAX:
            raise ValueError(f"tick spacing does not fit in int24: {self.tick_spacing}")
'''
replace = ''''''

[[mutation]]
name = "unknown pool resolved"
find = '''        if route not in self._keys:
            raise UnknownPool(route)
'''
replace = ''''''

[[mutation]]
name = "registry ignores chain"
find = '''        route = RoutingKey(chain_id=chain_id, pool_manager=pool_manager, pool_id=pool_id(key))'''
replace = '''        route = RoutingKey(chain_id=0, pool_manager=pool_manager, pool_id=pool_id(key))'''

[[mutation]]
name = "registry ignores manager"
find = '''        route = RoutingKey(chain_id=chain_id, pool_manager=pool_manager, pool_id=pool_id(key))'''
replace = '''        route = RoutingKey(chain_id=chain_id, pool_manager="0x0", pool_id=pool_id(key))'''

[[mutation]]
name = "routing key case sensitive"
find = '''        object.__setattr__(self, "pool_manager", self.pool_manager.lower())'''
replace = '''        pass'''
