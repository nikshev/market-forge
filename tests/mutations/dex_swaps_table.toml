# The swap table's own decisions.
source = "src/channelflow/tables/dex_swaps.py"
tests = "tests/unit/tables/test_dex_tables.py"

[[mutation]]
name = "big integers stored as int64"
find = '''        "sqrt_price_x96": None if swap.sqrt_price_x96 is None else str(swap.sqrt_price_x96),'''
replace = '''        "sqrt_price_x96": swap.sqrt_price_x96,'''

[[mutation]]
name = "amounts lose their sign"
find = '''        "amount0": swap.amount0,'''
replace = '''        "amount0": abs(swap.amount0),'''

[[mutation]]
name = "big integers not restored"
find = '''        elif name in _BIG_INTEGERS:
            restored[name] = int(str(value))'''
replace = '''        elif name in _BIG_INTEGERS:
            restored[name] = value'''

[[mutation]]
name = "decimals not restored"
find = '''        elif name in _DECIMALS:
            restored[name] = Decimal(str(value))'''
replace = '''        elif name in _DECIMALS:
            restored[name] = value'''

[[mutation]]
name = "an empty flush writes a snapshot"
find = '''        if not self._buffer:
            return None'''
replace = '''        if False:
            return None'''
