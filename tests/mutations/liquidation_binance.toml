# REQ-WP-094: Binance's forceOrder frame. The mutations are the sign of every liquidation number
# (which side was closed), the price and size that were really filled, and the time.
#
# Patterns are TOML *literal* strings on purpose: the basic form treats a
# trailing backslash as a line continuation and eats the next line's indentation.
source = "src/channelflow/connectors/binance/liquidation.py"
tests = ["tests/unit/connectors/test_context_liquidation_parsers.py"]

[[mutation]]
name = "a forced sell is a short that was liquidated"
find = '''{"SELL": "long_liquidated", "BUY": "short_liquidated"}'''
replace = '''{"SELL": "short_liquidated", "BUY": "long_liquidated"}'''

[[mutation]]
name = "the order's limit price is used, not the average fill"
find = '''    price = _decimal(order, "ap")
    if price <= 0:'''
replace = '''    price = _decimal(order, "p")
    if price <= 0:'''

[[mutation]]
name = "the order's size is used, not the filled quantity"
find = '''    qty = _decimal(order, "z")
    if qty <= 0:'''
replace = '''    qty = _decimal(order, "q")
    if qty <= 0:'''

[[mutation]]
name = "nothing filled is not a fallback"
find = '''    price = _decimal(order, "ap")
    if price <= 0:
        price = _decimal(order, "p")'''
replace = '''    price = _decimal(order, "ap")'''

[[mutation]]
name = "the time is the frame's send time, not the trade's"
find = '''        event_time_ns = int(order["T"]) * MS_TO_NS'''
replace = '''        event_time_ns = int(frame["E"]) * MS_TO_NS'''

[[mutation]]
name = "the notional is the quantity alone"
find = '''            notional_usd=price * qty,'''
replace = '''            notional_usd=qty,'''

[[mutation]]
name = "every symbol is returned"
find = '''    if symbols is not None and symbol not in symbols:
        return []'''
replace = '''    if False:
        return []'''

[[mutation]]
name = "a frame that is not a force order is parsed anyway"
find = '''    if frame.get("e") != "forceOrder":
        return []'''
replace = '''    if False:
        return []'''

[[mutation]]
name = "an unknown side is taken as a short"
find = '''    if side is None:
        raise LiquidationRefused(f"forceOrder: unknown side {order.get('S')!r}")'''
replace = '''    if side is None:
        side = "short_liquidated"'''

[[mutation]]
name = "a non-positive price and size are accepted"
find = '''    if price <= 0 or qty <= 0:
        raise LiquidationRefused(f"forceOrder: price {price} and quantity {qty} must be positive")'''
replace = '''    if False:
        raise LiquidationRefused(f"forceOrder: price {price} and quantity {qty} must be positive")'''
