# Reproduces the mutation sweep recorded for the performance measurements.
#
# Patterns are TOML *literal* strings on purpose: the basic form treats a
# trailing backslash as a line continuation and eats the next line's indentation.
source = "src/channelflow/perf/targets.py"
tests = ["tests/perf", "tests/unit/perf"]

[[mutation]]
name = "the percentile is a mean"
find = '''        ordered = sorted(self.samples_ns)
        rank = max(1, -(-len(ordered) * fraction // 1))
        return ordered[int(rank) - 1]'''
replace = '''        return int(sum(self.samples_ns) / len(self.samples_ns))'''

[[mutation]]
name = "the p95 is the p50"
find = '''    @property
    def p95_ns(self) -> int:
        return self.percentile_ns(0.95)'''
replace = '''    @property
    def p95_ns(self) -> int:
        return self.percentile_ns(0.5)'''

[[mutation]]
name = "an empty measurement is allowed"
find = '''        if not self.samples_ns:'''
replace = '''        if False and not self.samples_ns:'''

[[mutation]]
name = "scaling compares durations, not ratios"
find = '''    return tuple(
        later / max(1, earlier) for earlier, later in zip(picked, picked[1:], strict=False)
    )'''
replace = '''    return tuple(float(later) for later in picked[1:])'''

[[mutation]]
name = "scaling divides the wrong way"
find = '''        later / max(1, earlier) for earlier, later in zip(picked, picked[1:], strict=False)'''
replace = '''        earlier / max(1, later) for earlier, later in zip(picked, picked[1:], strict=False)'''

[[mutation]]
name = "a single measurement is a scaling series"
find = '''    if len(measurements) < 2:'''
replace = '''    if len(measurements) < 1:'''

[[mutation]]
name = "the budget is a thousand times larger"
find = '''        budget_ns=2 * NS_PER_SECOND,
    ),
    Target(
        name="signal_after_bar_close",'''
replace = '''        budget_ns=2000 * NS_PER_SECOND,
    ),
    Target(
        name="signal_after_bar_close",'''

[[mutation]]
name = "headroom is inverted"
find = '''    return target.budget_ns / max(1, observed)'''
replace = '''    return observed / max(1, target.budget_ns)'''

[[mutation]]
name = "a run of zero repeats is allowed"
find = '''    if repeats < 1:
        raise ValueError("a measurement needs at least one run")
    samples: list[int] = []'''
replace = '''    if repeats < 0:
        raise ValueError("a measurement needs at least one run")
    samples: list[int] = []'''

[[mutation]]
name = "a run of zero rounds is allowed"
find = '''    if repeats < 1:
        raise ValueError("a measurement needs at least one run")
    names = list(operations)'''
replace = '''    if repeats < 0:
        raise ValueError("a measurement needs at least one run")
    names = list(operations)'''

[[mutation]]
name = "measuring nothing is allowed"
find = '''    if not operations:
        raise ValueError("there is nothing to measure")'''
replace = '''    if False:
        raise ValueError("there is nothing to measure")'''

# REQ-INFRA-011: the sizes are measured in rounds, and a lower quantile is compared.
[[mutation]]
name = "the rounds always start with the same operation"
find = '''            name = names[(round_number + offset) % len(names)]'''
replace = '''            name = names[offset]'''

[[mutation]]
name = "the scaling ratio ignores the quantile it was given"
find = '''    picked = [measurement.percentile_ns(fraction) for measurement in measurements]'''
replace = '''    picked = [measurement.p50_ns for measurement in measurements]'''

[[mutation]]
name = "the interleaved measurements come back in another order"
find = '''    return tuple(Measurement(name=name, samples_ns=tuple(samples[name])) for name in names)'''
replace = '''    return tuple(Measurement(name=name, samples_ns=tuple(samples[name])) for name in reversed(names))'''

[[mutation]]
name = "the interleaved rounds read the real clock and not the one they were given"
find = '''            started = clock()
            operations[name]()
            samples[name].append(clock() - started)'''
replace = '''            started = time.perf_counter_ns()
            operations[name]()
            samples[name].append(time.perf_counter_ns() - started)'''

[[mutation]]
name = "each operation runs to completion before the next, which is the fault"
find = '''    for round_number in range(repeats):
        for offset in range(len(names)):
            name = names[(round_number + offset) % len(names)]'''
replace = '''    for offset in range(len(names)):
        for round_number in range(repeats):
            name = names[offset]'''
