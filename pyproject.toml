[project]
name = "market-forge-tools"
version = "0.1.0"
description = "Traceability tooling for the ChannelFlow project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "networkx>=3.4",
    "pyyaml>=6.0",
    # Product dependencies. PRD section 7 names asyncpg for Postgres metadata;
    # boto3 is the S3 client for the object store that ADR-002 makes the
    # canonical data plane.
    "asyncpg>=0.30",
    "boto3>=1.35",
    "pydantic>=2.13.5",
    "websockets>=17.1",
    "numpy>=2.5.3",
    # PRD section 28's read API (REQ-API-001). uvicorn is the ASGI server; the
    # tests use starlette's TestClient and need no server running.
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    # PRD section 7's target storage profile (REQ-STORE-001, ADR-002): Parquet as
    # the physical format on S3-compatible object storage, DuckDB for local and
    # CI analytics over extracts. Both are libraries; neither needs a service.
    "pyarrow>=18.0",
    # 1.5 is the floor because that is the version this was verified against:
    # it has `to_arrow_table` and deprecates `fetch_arrow_table`. An earlier
    # floor would be a guess about when the rename landed.
    "duckdb>=1.5",
    # PRD section 7 names Apache Iceberg as the table format for normalized,
    # feature and research-grade datasets, and ADR-002 adopted it from the
    # start; ADR-060 records why the hand-rolled approximation is being
    # replaced. `sql-sqlite` is the catalog: a file locally and in the fast
    # gate, the same implementation against PostgreSQL on the stack, so
    # REQ-INFRA-002's rule that a commit needs no running service survives.
    # 0.12 is the floor because that is the version the behaviour in ADR-060
    # was measured against.
    "pyiceberg[sql-sqlite]>=0.12",
]

[project.optional-dependencies]
# The SDD toolchain. Declared here rather than installed ad hoc: anything not
# in this file is one `uv sync` away from vanishing, which is how `specify` and
# `graphify` disappeared the first time a lockfile was generated.
tooling = [
    "specify-cli>=1.0.4",
    "graphifyy>=0.9.55",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[project.scripts]
trace = "tools.trace.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tools*", "channelflow*"]
where = [".", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "trace(*requirement_ids): link this test to one or more requirement IDs",
    "integration: needs live services; deselected by the fast local gate, run in CI",
]

[tool.mypy]
# Strict over the product tree only. tools/ predates this decision; see
# specs/002-project-bootstrap/research.md for why retrofitting it is not
# part of REQ-WP-001.
files = ["src"]
strict = true
python_version = "3.12"

# pyarrow and duckdb ship no type information (no py.typed marker, no stubs on
# PyPI). Ignoring the missing imports is narrower than it looks: strict mode
# still checks every signature in this repository that touches them, so a
# function returning a `pa.Table` is still checked at its own boundary -- only
# the libraries' internals are unknown. The alternative, hand-written stubs for
# two large C++ bindings, would be a second source of truth about someone else's
# API (REQ-STORE-001).
[[tool.mypy.overrides]]
module = ["pyarrow.*", "duckdb.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
